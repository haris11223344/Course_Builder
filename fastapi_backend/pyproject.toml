[project]
name = "courseforge-backend"
version = "0.1.0"
description = "Production-grade backend for CourseForge - AI-Powered Course Generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "asyncmy>=0.2.9",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "email-validator>=2.1.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1.0; python_version < '3.13'",
    "bcrypt>=4.0.0; python_version >= '3.13'",
    "python-multipart>=0.0.9",
    "authlib>=1.3.0",
    "httpx>=0.27.0",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "apscheduler>=3.10.4",
    "loguru>=0.7.2",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "httpx>=0.27.0",
]
